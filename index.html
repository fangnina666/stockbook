<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>StockBook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.css" />

  <style>
    html, body { height: 100%; }
    body { overflow-y: auto; }
    
    .sidebar-report-select {
      padding: 12px 10px;
      background: #f8f9fa;
      border-bottom: 1px solid #e1e4e8;
      margin-bottom: 10px;
    }
    .sidebar-report-select label {
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }
    .sidebar-report-select select {
      width: 100%;
      margin-top: 6px;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 13px;
      background: #fff;
      cursor: pointer;
    }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-116QT56CXC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-116QT56CXC');
  </script>
</head>
<body>
  <div id="app">Loading…</div>

  <script>
    function jumpToReport(selectElement) {
      if (selectElement.value) {
        location.href = selectElement.value;
      }
    }

    window.$docsify = {
      name: 'StockBook',
      basePath: '/stockbook/',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 3,
      sidebarDisplayLevel: 3,
      // 確保搜尋設定完整
      search: {
        maxAge: 86400000, // 過期時間，單位毫秒（1天）
        paths: 'auto',
        placeholder: '搜尋報告…',
        noData: '沒有找到結果！',
        // 避開 basePath 可能造成的路徑抓取錯誤
        depth: 6
      },
      plugins: [
        function (hook, vm) {
          hook.doneEach(function () {
            const sidebar = document.querySelector('.sidebar-nav');
            if (sidebar && !document.getElementById('md-select')) {
              const selectContainer = document.createElement('div');
              selectContainer.className = 'sidebar-report-select';
              selectContainer.innerHTML = `
                <label for="md-select">📂 快速選擇全部報告：</label><br>
                <select id="md-select" onchange="jumpToReport(this)">
                  <option value="">-- 載入全部報告中 --</option>
                </select>
              `;
              
              // 插入在搜尋框下方或側邊欄最上方，確保不影響 .search 區塊
              const searchBox = document.querySelector('.sidebar .search');
              if (searchBox) {
                searchBox.after(selectContainer);
              } else {
                sidebar.insertBefore(selectContainer, sidebar.firstChild);
              }

              // 自動抓取側邊欄內的所有連結與階層，轉化為下拉選單的 optgroup 分群
              setTimeout(() => {
                const select = document.getElementById('md-select');
                if (!select) return;
                select.innerHTML = '<option value="">-- 請選擇報告 --</option>';

                const sidebarNav = document.querySelector('.sidebar-nav');
                if (!sidebarNav) return;

                const links = sidebarNav.querySelectorAll('a');
                let groups = {};

                links.forEach(link => {
                  const href = link.getAttribute('href');
                  const text = link.innerText.trim();

                  if (!href || href.includes('README') || href.includes('Uindex') || text === '首頁' || text === '報告列表') return;

                  let groupName = '其他報告';
                  const match = href.match(/(\d{4})[/-](\d{2})/);
                  if (match) {
                    groupName = `${match[1]} 年 ${match[2]} 月`;
                  } else {
                    const textMatch = text.match(/(\d{4})[.-](\d{2})/);
                    if (textMatch) {
                      groupName = `${textMatch[1]} 年 ${textMatch[2]} 月`;
                    }
                  }

                  if (!groups[groupName]) {
                    groups[groupName] = [];
                  }
                  groups[groupName].push({ href, text });
                });

                for (let gName in groups) {
                  const optgroup = document.createElement('optgroup');
                  optgroup.label = `📁 ${gName}`;
                  groups[gName].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.href;
                    opt.innerText = ` └ ${item.text}`;
                    optgroup.appendChild(opt);
                  });
                  select.appendChild(optgroup);
                }

                if (!location.hash || location.hash === '#/' || location.hash === '') {
                  const firstOpt = select.querySelector('option[value]');
                  if (firstOpt && firstOpt.value) {
                    select.value = firstOpt.value;
                    location.href = firstOpt.value;
                  }
                } else {
                  select.value = location.hash;
                }
              }, 300);
            }
          });
        }
      ]
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
