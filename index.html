<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>StockBook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css" />

  <!-- 【新增 1】引入 Docsify Vue 佈景主題（提升整體排版質感） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css" />
  <!-- 可選：折疊側欄樣式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.css" />

  <style>
    /* 保險：強制頁面可垂直捲動 */
    html, body { height: 100%; }
    body { overflow-y: auto; }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-116QT56CXC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-116QT56CXC');
  </script>
</head>
<body>
  <div id="app">Loading…</div>

  <script>
    window.$docsify = {
      name: 'StockBook',
      /* 如果是 GitHub Pages 的 project site，請改成你的專案子路徑，例：'/stockbook/' */
      /* 不要加 '#/' */
      basePath: '/stockbook/',

      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 3,
      sidebarDisplayLevel: 3,   // 預設展開到 年/月/日
      search: {
        paths: 'auto',
        placeholder: '搜尋報告…',
        noData: '沒有找到結果',
        maxAge: 86400000
      }
    }
  </script>

  <!-- 只要載一次 docsify 核心！ -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugin 需在 docsify 後面載入 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>

  <!-- 在你的網頁中加入這段 HTML 容器 -->
  <div style="text-align: center; margin-top: 20px; font-size: 14px; color: #666;">
    👀 本站總瀏覽人次：<span id="visit-count">載入中...</span>
  </div>
  
  <!-- 搭配這段 JavaScript 自動抓取與累加次數 -->
  <script>
    fetch('https://api.countapi.xyz/hit/fangnina666-stockbook/visits')
      .then(response => response.json())
      .then(data => {
        document.getElementById('visit-count').innerText = data.value;
      })
      .catch(error => {
        document.getElementById('visit-count').innerText = '計算中';
      });
</script>

</body>
</html>
